<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shigoto Characters</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden; font: 13px/1.4 system-ui, sans-serif; color: #eee; }
  #hud { position: fixed; left: 12px; top: 12px; background: rgba(10, 12, 16, 0.72); padding: 10px 12px; border-radius: 8px; max-width: 320px; }
  #hud h1 { font-size: 14px; margin: 0 0 6px; letter-spacing: 0.04em; }
  #hud select, #hud button { background: #2a3038; color: #eee; border: 1px solid #444c56; border-radius: 4px; padding: 3px 7px; margin: 2px 2px 2px 0; font-size: 12px; }
  #hud button.on { background: #c8102e; border-color: #e0304a; }
  #stats { font: 11px/1.45 ui-monospace, monospace; color: #b8c4d0; margin-top: 6px; white-space: pre-wrap; }
  body.shot #hud { display: none; }
</style>
</head>
<body>
<div id="hud">
  <h1>SHIGOTO · characters</h1>
  <div><select id="model"></select> <select id="q"><option>low</option><option>medium</option><option selected>high</option><option>ultra</option></select></div>
  <div id="lights"></div>
  <div><button id="raw">Original materials</button> <button id="wet">Rain</button> <button id="close">Close-up</button></div>
  <div id="stats"></div>
</div>
<script>
window.__three = function () { if (!window.THREE) document.write('<script src="../../Game/vendor/three.min.js"><\/script>'); };
window.__gltf = function () { if (!THREE.GLTFLoader) document.write('<script src="../../Game/vendor/GLTFLoader.js"><\/script>'); };
</script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js" onerror="window.__three()"></script>
<script>window.__three();</script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js" onerror="window.__gltf()"></script>
<script>window.__gltf();</script>
<script src="shigoto.js"></script>
<script>
// The character viewer for the Shigoto character layer: any person in people/real (or ?dir=people/ for another set) under studio,
// daylight or night-street light, with the engine's materials or the model's own. ?model=salaryman_04&light=sun&q=ultra&close&shot
(async function () {
  const Q = new URLSearchParams(location.search);
  if (Q.has("shot")) document.body.classList.add("shot");
  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(Math.min(2, devicePixelRatio)); renderer.setSize(innerWidth, innerHeight);
  renderer.outputEncoding = THREE.sRGBEncoding; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.appendChild(renderer.domElement);
  const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.05, 200);
  addEventListener("resize", () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });

  // a small room of soft panels, prefiltered, for reflections and ambient light
  function envFrom(colTop, colSide, colKey) {
    const s = new THREE.Scene(), box = new THREE.BoxGeometry(1, 1, 1);
    const room = new THREE.Mesh(box, new THREE.MeshBasicMaterial({ color: colSide, side: THREE.BackSide })); room.scale.set(20, 10, 20); s.add(room);
    const panel = (c, x, y, z, sx, sy, sz) => { const m = new THREE.Mesh(box, new THREE.MeshBasicMaterial({ color: c })); m.position.set(x, y, z); m.scale.set(sx, sy, sz); s.add(m); };
    panel(colTop, 0, 4.9, 0, 12, 0.1, 12); panel(colKey, -9.9, 2, 3, 0.1, 5, 6); panel(new THREE.Color(colKey).multiplyScalar(0.4), 9.9, 2, -3, 0.1, 4, 4);
    const pm = new THREE.PMREMGenerator(renderer), rt = pm.fromScene(s, 0.04); pm.dispose(); return rt.texture;
  }
  const LIGHTS = {
    studio: { env: envFrom(0xffffff, 0x303236, 0xfff2e0), key: [0xfff1e0, 3.2, [-2.5, 3, 2.5]], rim: [0xcfe0ff, 2.2, [2, 2.5, -3]], hemi: 0.25, bg: 0x2a2c30 },
    sun:    { env: envFrom(0xbfdcff, 0x8a8f86, 0xffffff), key: [0xfff0d8, 4.0, [3, 6, 4]], rim: [0x9cc4ff, 0.6, [-3, 2, -3]], hemi: 0.5, bg: 0x9fbfe0 },
    night:  { env: envFrom(0x101520, 0x06070a, 0xff9a50), key: [0xffa060, 2.6, [-1.5, 2.6, 1.5]], rim: [0x40a0ff, 3.0, [2, 1.8, -2]], hemi: 0.05, bg: 0x05060a },
    dusk:   { env: envFrom(0xffb38a, 0x3a3048, 0xff8a50), key: [0xff9a60, 3.0, [-4, 1.2, 1]], rim: [0x8090ff, 1.4, [3, 3, -2]], hemi: 0.2, bg: 0x40304a }
  };
  const key = new THREE.DirectionalLight(), rim = new THREE.DirectionalLight(), hemi = new THREE.HemisphereLight(0xffffff, 0x404040);
  key.castShadow = true; key.shadow.mapSize.set(2048, 2048); key.shadow.bias = -0.0004; key.shadow.normalBias = 0.02;
  Object.assign(key.shadow.camera, { left: -1.5, right: 1.5, top: 2.2, bottom: -0.2, near: 0.1, far: 20 });
  scene.add(key, rim, hemi);
  const floor = new THREE.Mesh(new THREE.CircleGeometry(4, 64).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0x3a3a3a, roughness: 0.8 }));
  floor.receiveShadow = true; scene.add(floor);
  let light = Q.get("light") || "studio";
  function setLight(n) {
    light = n; const L = LIGHTS[n];
    scene.environment = L.env; scene.background = new THREE.Color(L.bg);
    key.color.set(L.key[0]); key.intensity = L.key[1]; key.position.fromArray(L.key[2]);
    rim.color.set(L.rim[0]); rim.intensity = L.rim[1]; rim.position.fromArray(L.rim[2]); hemi.intensity = L.hemi;
    document.querySelectorAll("#lights button").forEach(b => b.classList.toggle("on", b.textContent === n));
  }
  Object.keys(LIGHTS).forEach(n => { const b = document.createElement("button"); b.textContent = n; b.onclick = () => setLight(n); document.getElementById("lights").appendChild(b); });
  setLight(light);

  const chars = SHIGOTO.characters(THREE, { quality: Q.get("q") || "high", msaa: true });
  window.chars = chars;
  const dir = Q.get("dir") || "../people/real/";
  const ix = await (await fetch(dir + "index.json")).json();
  const files = ix.people.map(p => p.file).concat((ix.outfits || []).map(o => o.file));
  const sel = document.getElementById("model");
  [...new Set(files)].forEach(f => { const o = document.createElement("option"); o.textContent = f.replace(".glb", ""); sel.appendChild(o); });
  sel.value = Q.get("model") || "salaryman_04";
  document.getElementById("q").value = chars.quality;
  let raw = Q.has("raw"), close = Q.has("close"), cur = null, gltf = null, yaw = 0.35, pitch = 0.05;
  const loader = new THREE.GLTFLoader();
  function show() {
    if (cur) scene.remove(cur);
    if (!gltf) return;
    const root = gltf.scene;      // loaded fresh for every change, so the original and the upgraded can be swapped
    cur = new THREE.Group(); cur.add(root);
    root.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; o.frustumCulled = false; } });
    if (!raw) chars.upgrade(root, { quality: document.getElementById("q").value, hero: true, model: sel.value });
    const box = new THREE.Box3().setFromObject(root); const h = box.max.y - box.min.y;
    root.scale.setScalar(1.72 / h); root.position.y = -box.min.y * 1.72 / h;
    scene.add(cur);
    let tris = 0; root.traverse(o => { if (o.isMesh) tris += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3; });
    const r = chars.report();
    document.getElementById("stats").textContent = sel.value + "  " + Math.round(tris) + " tris  " + (raw ? "original materials" : "Shigoto " + chars.quality) +
      "\nmaterials " + JSON.stringify(r.kinds) + "\nsynthesised " + r.synthesised + (r.missing.length ? "\nmissing: " + r.missing.slice(0, 6).join("; ") : "");
  }
  function load() { loader.load(dir + sel.value + ".glb", g => { gltf = g; window.__loaded = sel.value; show(); }); }
  sel.onchange = load;
  document.getElementById("q").onchange = e => { chars.setQuality(e.target.value); load(); };
  const rb = document.getElementById("raw"), wb = document.getElementById("wet"), cb = document.getElementById("close");
  rb.classList.toggle("on", raw); cb.classList.toggle("on", close);
  rb.onclick = () => { raw = !raw; rb.classList.toggle("on", raw); load(); };
  wb.onclick = () => { chars.setWet(chars.uniforms.chWet.value > 0 ? 0 : 0.8); wb.classList.toggle("on", chars.uniforms.chWet.value > 0); };
  cb.onclick = () => { close = !close; cb.classList.toggle("on", close); };
  if (Q.has("wet")) { chars.setWet(0.8); wb.classList.add("on"); }
  if (Q.has("yaw")) yaw = parseFloat(Q.get("yaw"));
  let drag = null;
  addEventListener("pointerdown", e => { if (e.target === renderer.domElement) drag = [e.clientX, e.clientY]; });
  addEventListener("pointerup", () => drag = null);
  addEventListener("pointermove", e => { if (!drag) return; yaw -= (e.clientX - drag[0]) * 0.01; pitch = Math.max(-0.4, Math.min(0.6, pitch + (e.clientY - drag[1]) * 0.005)); drag = [e.clientX, e.clientY]; });
  load();
  window.__frame = function () {
    const d = close ? 0.85 : 4.6, ty = close ? 1.6 : 0.95;
    camera.position.set(Math.sin(yaw) * Math.cos(pitch) * d, ty + Math.sin(pitch) * d, Math.cos(yaw) * Math.cos(pitch) * d);
    camera.lookAt(0, ty, 0); renderer.render(scene, camera); return renderer.domElement.toDataURL("image/png");
  };
  if (Q.has("still")) return;      // automated captures draw one frame when asked
  (function frame() {
    const d = close ? 0.85 : 4.6, ty = close ? 1.6 : 0.95;
    camera.position.set(Math.sin(yaw) * Math.cos(pitch) * d, ty + Math.sin(pitch) * d, Math.cos(yaw) * Math.cos(pitch) * d);
    camera.lookAt(0, ty, 0);
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  })();
})();
</script>
</body>
</html>

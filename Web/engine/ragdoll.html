<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shigoto Ragdoll</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden; font: 13px/1.4 system-ui, sans-serif; color: #eee; }
  #hud { position: fixed; left: 12px; top: 12px; background: rgba(10, 12, 16, 0.72); padding: 10px 12px; border-radius: 8px; max-width: 340px; }
  #hud h1 { font-size: 14px; margin: 0 0 6px; letter-spacing: 0.04em; }
  #hud button, #hud select { background: #2a3038; color: #eee; border: 1px solid #444c56; border-radius: 4px; padding: 3px 7px; margin: 2px 2px 2px 0; font-size: 12px; }
  #stats { font: 11px/1.45 ui-monospace, monospace; color: #b8c4d0; margin-top: 6px; white-space: pre-wrap; }
  body.shot #hud { display: none; }
</style>
</head>
<body>
<div id="hud">
  <h1>SHIGOTO · ragdoll</h1>
  <div><select id="model"></select></div>
  <div><button data-k="car">Hit by a car</button><button data-k="fast">Hit at 70 km/h</button><button data-k="over">Over the bars</button><button data-k="loop">Loop-out</button><button data-k="low">Low-side</button><button data-k="shot">Shot</button><button data-k="dead">Killed</button></div>
  <div id="stats"></div>
</div>
<script>
window.__three = function () { if (!window.THREE) document.write('<script src="../../Game/vendor/three.min.js"><\/script>'); };
window.__gltf = function () { if (!THREE.GLTFLoader) document.write('<script src="../../Game/vendor/GLTFLoader.js"><\/script>'); };
</script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js" onerror="window.__three()"></script>
<script>window.__three();</script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js" onerror="window.__gltf()"></script>
<script>window.__gltf();</script>
<script src="shigoto.js"></script>
<script>
// The ragdoll sandbox: a person from people/real knocked over, thrown off a bike or shot, again and again, on flat ground
// with a wall (x = 7) and a kerb (z > 4). ?model=salaryman_04&k=car&auto (cycle every kind)&shot (no HUD)
(async function () {
  const Q = new URLSearchParams(location.search);
  if (Q.has("shot")) document.body.classList.add("shot");
  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(Math.min(2, devicePixelRatio)); renderer.setSize(innerWidth, innerHeight);
  renderer.outputEncoding = THREE.sRGBEncoding; renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.shadowMap.enabled = true;
  document.body.appendChild(renderer.domElement);
  const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.05, 300);
  scene.background = new THREE.Color(0x9fbfe0);
  scene.add(new THREE.HemisphereLight(0xdfeaff, 0x6a6458, 0.8));
  const sun = new THREE.DirectionalLight(0xfff0d8, 2.2); sun.position.set(6, 12, 5); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -15, right: 15, top: 15, bottom: -15 }); scene.add(sun);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshStandardMaterial({ color: 0x55585c, roughness: 0.9 }));
  floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
  scene.add(new THREE.GridHelper(200, 200, 0x777777, 0x666666));
  const wall = new THREE.Mesh(new THREE.BoxGeometry(1, 3, 30), new THREE.MeshStandardMaterial({ color: 0x8a8076, roughness: 0.8 })); wall.position.set(7.5, 1.5, 0); wall.castShadow = wall.receiveShadow = true; scene.add(wall);
  const kerb = new THREE.Mesh(new THREE.BoxGeometry(14, 0.15, 30), new THREE.MeshStandardMaterial({ color: 0x9a968e, roughness: 0.85 })); kerb.position.set(0, 0.075, 19); kerb.receiveShadow = true; scene.add(kerb);

  const sys = new SHIGOTO.RagdollSystem({ THREE, ground: (x, z) => (z > 4 && Math.abs(x) < 7 ? 0.15 : 0), blocked: (x, z, r) => x + r > 7, friction: () => 0.7 });
  const list = await fetch("../people/real/index.json").then(r => r.json()).catch(() => null);
  const names = (list && (list.people || list)) ? (list.people || list).map(e => e.name || e.file || e).filter(n => typeof n === "string") : ["man_01"];
  const sel = document.getElementById("model");
  names.forEach(n => { const o = document.createElement("option"); o.textContent = n.replace(/\.glb$/, ""); sel.appendChild(o); });
  sel.value = Q.get("model") || "salaryman_04"; if (!sel.value) sel.selectedIndex = 0;

  const R = window.__rag = { sys, rd: null, log: [], bad: 0, maxErr: 0, kind: "", done: 0, standing: [] };
  let holder = null, lens = null;
  async function load(name) {
    if (holder) { scene.remove(holder); holder = null; }
    const g = await new Promise((ok, no) => new THREE.GLTFLoader().load("../people/real/" + name.replace(/\.glb$/, "") + ".glb", ok, undefined, no));
    SHIGOTO.bipedNames(g.scene);
    g.scene.traverse(o => { if (o.isMesh) { o.castShadow = true; } });
    const box = new THREE.Box3().setFromObject(g.scene), s = 1.75 / Math.max(0.3, box.max.y - box.min.y);
    const wrap = new THREE.Group(); wrap.add(g.scene); g.scene.scale.setScalar(s); g.scene.position.y = -box.min.y * s;
    holder = new THREE.Group(); holder.add(wrap); scene.add(holder);
    R.root = holder;
  }
  // segment lengths measured between bones, to check that nothing stretches
  function measure() {
    const B = SHIGOTO.findRagdollBones(holder); if (!B) return null;
    const w = b => b.getWorldPosition(new THREE.Vector3());
    return [[B.lThigh, B.lCalf], [B.lCalf, B.lFoot], [B.rThigh, B.rCalf], [B.lUpper, B.lFore], [B.lFore, B.lHand], [B.pelvis, B.head]].map(p => w(p[0]).distanceTo(w(p[1])));
  }
  function reset() {
    holder.position.set(0, 0, 0); holder.rotation.set(0, 0, 0);
    const B = SHIGOTO.findRagdollBones(holder);
    holder.updateMatrixWorld(true);
  }
  function hit(k) {
    if (R.rd && R.rd.state !== "done") sys.release(R.rd);
    reset(); holder.updateMatrixWorld(true); lens = measure(); R.kind = k;
    const o = { onUp: (rd, up) => { holder.position.set(up.x, up.y, up.z); holder.rotation.set(0, up.yaw, 0); R.standing.push({ k, up, prone: up.prone }); } };
    if (k === "car") o.strike = { x: 0, y: 0, z: 8 };
    else if (k === "fast") o.strike = { x: 0, y: 0, z: 19.4 };
    else if (k === "over") { holder.position.y = 0.3; o.velocity = { x: 0, y: 3, z: 14 }; o.spin = { x: 5, y: 0, z: 0 }; }
    else if (k === "loop") { holder.position.y = 0.3; o.velocity = { x: 0, y: 1.4, z: 4 }; o.spin = { x: -3, y: 0, z: 0 }; }
    else if (k === "low") { o.velocity = { x: 1.5, y: 0.4, z: 12 }; o.spin = { x: 0, y: 0, z: 2.6 }; }
    else if (k === "shot") { o.push = { x: 0, y: 0.2, z: -2.4, at: "chest" }; o.dead = true; }
    else if (k === "dead") { o.strike = { x: 6, y: 0, z: 6 }; o.dead = true; }
    holder.updateMatrixWorld(true);
    R.rd = sys.spawn(holder, o);
    R.log.push(k + (R.rd ? " spawned" : " FAILED"));
  }
  R.hit = hit;
  document.querySelectorAll("[data-k]").forEach(b => b.onclick = () => hit(b.dataset.k));
  sel.onchange = async () => { await load(sel.value); hit("car"); };
  await load(sel.value);
  hit(Q.get("k") || "car");
  const KINDS = ["car", "fast", "over", "loop", "low", "shot", "dead"]; let ki = 0;

  let last = performance.now(), wait = 0;
  const stats = document.getElementById("stats"), _p = new THREE.Vector3();
  function frame() {
    const now = performance.now(), dt = Math.min(0.05, (now - last) / 1000); last = now;
    sys.update(dt);
    const rd = R.rd;
    if (rd && rd.state !== "done" && lens) {
      const m = measure(); if (m) m.forEach((v, i) => { const e = Math.abs(v - lens[i]) / lens[i]; R.maxErr = Math.max(R.maxErr, e); if (!isFinite(v)) R.bad++; });
      sys.pelvis(rd, _p);
      if (!isFinite(_p.x + _p.y + _p.z)) R.bad++;
    } else if (rd) { holder.updateMatrixWorld(true); _p.setFromMatrixPosition(holder.matrixWorld); }
    if (rd && (rd.state === "done" || rd.state === "frozen")) {
      wait += dt;
      if (wait > 1.2) { wait = 0; R.done++; if (Q.has("auto")) { ki = (ki + 1) % KINDS.length; hit(KINDS[ki]); } }
    }
    // the camera follows the body from the side
    const tgt = rd ? sys.pelvis(rd, new THREE.Vector3()) : new THREE.Vector3(0, 1, 0);
    camera.position.lerp(new THREE.Vector3(tgt.x - 6.5, 2.4, tgt.z - 1.5), 1 - Math.pow(0.05, dt)); camera.lookAt(tgt.x, 0.6, tgt.z);
    stats.textContent = (rd ? R.kind + " · " + rd.state + " · " + rd.t.toFixed(1) + " s\npelvis " + tgt.y.toFixed(2) + " m · hurt " + rd.hurt.toFixed(1) : "") + "\nstretch " + (R.maxErr * 100).toFixed(1) + " %";
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  frame();
})();
</script>
</body>
</html>

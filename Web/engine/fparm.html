<script>
// Seiko's own arm, seen through his own eyes: the pictures the game shows when he looks at his phone (his right hand round it, under
// the HUD phone) and at his watch (his left forearm raised, the watch drawn on at the wrist by the game).
//
// Built from his realistic model in the outfit he is wearing, upgraded by the Shigoto character shader (subdivided, skin with
// subsurface, cloth sheen), posed in world space (two-bone IK on the arm, the hand turned from where its knuckles are, every finger
// curled joint by joint), and given arm hair: thousands of fine fibres grown on the skin of the forearm, the back of the hand and
// the fingers (the skin is found from the model's own skin mask, the blue channel of its ORM map), lying along the arm towards the
// hand. Driven by Tools/hud/render_fparm.mjs, which saves the PNGs and where the phone and the watch land in them.
//   ?model=seiko_suit_charcoal  &w= &h=
(async function () {
  const Q = new URLSearchParams(location.search);

    const panel = (c, x, y, z, sx, sy, sz) => { const m = new THREE.Mesh(box, new THREE.MeshBasicMaterial({ color: c })); m.position.set(x, y, z); m.scale.set(sx, sy, sz); s.add(m); };
    panel(0xfffaf2, 0, 4.9, 0, 14, 0.1, 14); panel(0xffe6cc, -9.9, 2, 3, 0.1, 5, 7); panel(0x8fa6d0, 9.9, 2, -3, 0.1, 5, 6); panel(0x2a2826, 0, -4.9, 0, 20, 0.1, 20);
    const pm = new THREE.PMREMGenerator(renderer); scene.environment = pm.fromScene(s, 0.04).texture; pm.dispose(); }
  const key = new THREE.DirectionalLight(0xfff0e0, 2.3), fill = new THREE.DirectionalLight(0xc4d4ff, 0.7), rim = new THREE.DirectionalLight(0xffffff, 0.9), hemi = new THREE.HemisphereLight(0xf4f6ff, 0x3a332c, 0.35);

  const chars = SHIGOTO.characters(THREE, { quality: "ultra" });
  const loader = new THREE.GLTFLoader();
  const model = Q.get("model") || "seiko_suit_charcoal";

    });

  if (!Q.has("raw")) chars.upgrade(root, { hero: true, quality: "ultra", model: "seiko" });
  const B = {}; root.traverse(o => { if (o.isBone) B[o.name.replace(/^Bip01[_ ]/, "").replace(/ /g, "_")] = o; });
  const rest = {}; Object.keys(B).forEach(k => rest[k] = B[k].quaternion.clone());
  const meshes = []; root.traverse(o => { if (o.isSkinnedMesh) meshes.push(o); });

  // ---- posing (world space) --------------------------------------------------------------------------------------------------------------

  }
  // the hand's frame: f along the middle finger, a across the knuckles (little finger to index), p out of the palm, as a right-handed (f, p, a)
  function handFrame(A) {

    if (thumb) thumb(C);
  }
  function resetPose() { Object.keys(B).forEach(k => B[k].quaternion.copy(rest[k])); root.updateMatrixWorld(true); }

  // ---- arm hair ---------------------------------------------------------------------------------------------------------------------------

  const hairMat = new THREE.MeshStandardMaterial({ color: 0x1b1410, roughness: 0.55, metalness: 0, transparent: true, opacity: 0.85, depthWrite: false, side: THREE.DoubleSide });
  function rnd(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
  function maskAt(m, u, v) {

    u = u - Math.floor(u); v = v - Math.floor(v); const y = S.flipY === false ? v : 1 - v;
    const i = ((Math.min(S.h - 1, (y * S.h) | 0)) * S.w + Math.min(S.w - 1, (u * S.w) | 0)) * 4;

      if (!P || !UV || !SI) return;

      out.cuff = sleeved ? Math.min(cuff - along, -0.009) : null;   // the cuff over no more than the back quarter of the watch

      out.hand = project(hd); out.watch = { cuff: out.cuff, x: pw[0], y: pw[1], ang: Math.atan2(pa[1] - pw[1], pa[0] - pw[0]), pxPerM: Math.hypot(pa[0] - pw[0], pa[1] - pw[1]) / 0.02, across: Math.hypot(pb[0] - pw[0], pb[1] - pw[1]) / 0.02 };
      target = watch;
      out.hairs = growHair(bonesOf(A), { density: P.hair, seed: 5, region: (p) => {
        const along = p.clone().sub(fa).dot(dir) / hd.distanceTo(fa);
        if (along < 1.0) return { dir: dir, len: 0.0075, w: 0.000045, keep: 1 };
        const C2 = handFrame(A); const ff = p.clone().sub(hd).dot(C2.f);
        if (ff < 0.07) return { dir: C2.f, len: 0.005, w: 0.00004, keep: 0.45 };
        return { dir: C2.f, len: 0.0035, w: 0.000035, keep: 0.12 };
      } });
    }
    lights(target);
    // don't draw what is behind his eyes (his own head and collar)
    camera.near = 0.06; camera.updateProjectionMatrix();
    B.Head && (B.Head.scale.setScalar(1e-4));
    root.updateMatrixWorld(true);
    renderer.render(scene, camera);
    B.Head && B.Head.scale.setScalar(1);
    out.url = renderer.domElement.toDataURL("image/png");
    return out;
  };
  window.__ready = true;
})().catch(e => { window.__err = String(e && e.stack || e); });

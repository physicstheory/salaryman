# The AAA gate (Tools/qa/aaa_gate.py) on every push and pull request, from any branch.
# Same check as the pre-push hook, so a push that skipped the hook still gets caught here.
name: AAA gate

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install --quiet pillow numpy

      - name: Run the gate
        env:
          BEFORE: ${{ github.event.before || github.event.pull_request.base.sha }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          against=""
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            git fetch --quiet --depth=1 origin "$BEFORE" || true
            git cat-file -e "$BEFORE" 2>/dev/null && against="--against $BEFORE"
          fi
          allow=""
          case "$MSG" in *"[aaa-loosen-approved]"*) allow="--allow-loosen";; esac
          python Tools/qa/aaa_gate.py $against $allow --json aaa-report.json | tee aaa-report.txt
          exit ${PIPESTATUS[0]}

      - name: Summary
        if: always()
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          head -c 60000 aaa-report.txt >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
